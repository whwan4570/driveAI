[project]
name = "carmori"
version = "0.1.0"
description = "Carmori MVP backend: washer-fluid refill state machine, vehicle memory, replay harness"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "httpx>=0.27",
  "openai>=2.0",
  "meta-sam-parser>=0.1.0",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
  "transitions>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
carmori-replay = "carmori.replay:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carmori*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
