# Render Blueprint: one web service serves the built web app at / and the API at /api.
# The disk keeps SQLite, owner manuals and 3D models across deploys and restarts.
# Starter + disk are paid; switch the plan back (and remove the disk) after the demo.
services:
  - type: web
    name: carmori
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -e ./backend && cd web && npx --yes pnpm@11.5.3 install --frozen-lockfile && npx --yes pnpm@11.5.3 build
    startCommand: cd backend && uvicorn carmori.site:create_site --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: carmori-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: META_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: NODE_VERSION
        value: "22"
      - key: CARMORI_DB_PATH
        value: /var/data/carmori.sqlite
      - key: SPARK_VISION_MODEL
        value: muse-spark-1.3
      - key: SPARK_REASONING_EFFORT
        value: minimal
      - key: SPARK_TIMEOUT_S
        value: "20"
